[project]
name = "helix-engines"
version = "0.1.0"
description = "Helix Python engines: FastAPI gateway, RAG, EvalForge, TrainingOps, market intelligence"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oleh Kornii" }]
keywords = ["fastapi", "rag", "evals", "lora", "mcp", "quant"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.8",
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
helix = "helix.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["helix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
