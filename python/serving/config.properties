# TorchServe configuration for Helix reranker
# Docs: https://pytorch.org/serve/configuration.html

inference_address=http://0.0.0.0:8080
management_address=http://0.0.0.0:8081
metrics_address=http://0.0.0.0:8082

# Number of workers per model (adjust based on GPU count)
# Default: number of CPU cores. For GPU, set to number of GPUs.
default_workers_per_model=1

# Batch size for inference (TorchServe batches requests)
batch_size=8

# Max batch delay in milliseconds (wait for batch to fill)
max_batch_delay=100

# Model response timeout in seconds
model_response_timeout=300

# Enable metrics
enable_metrics_api=true

# Model store
model_store=model_store

# Load models on startup
load_models=helix-reranker.mar

# GPU allocation (if available)
# number_of_gpu=1

# Logging
log_level=INFO
