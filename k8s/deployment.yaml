apiVersion: apps/v1
kind: Deployment
metadata:
  name: helix-engines
  namespace: helix
  labels:
    app: helix
    component: engines
spec:
  replicas: 2
  selector:
    matchLabels:
      app: helix
      component: engines
  template:
    metadata:
      labels:
        app: helix
        component: engines
    spec:
      containers:
        - name: engines
          image: helix-engines:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: helix-config
            - secretRef:
                name: helix-secrets
          env:
            - name: HELIX_DATA_DIR
              value: "/data"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: helix-data
              mountPath: /data
      volumes:
        - name: helix-data
          persistentVolumeClaim:
            claimName: helix-data-pvc
