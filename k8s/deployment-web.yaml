apiVersion: apps/v1
kind: Deployment
metadata:
  name: helix-web
  namespace: helix
  labels:
    app: helix
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: helix
      component: web
  template:
    metadata:
      labels:
        app: helix
        component: web
    spec:
      containers:
        - name: web
          image: helix-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: HELIX_ENGINE_URL
              value: "http://helix-engines:8090"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
